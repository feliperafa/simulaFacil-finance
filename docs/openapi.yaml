openapi: 3.1.0
info:
  title: SimulaFácil — contrato proposto (não disponível no MVP)
  version: 1.0.0-draft
  description: Preparação para Supabase Functions ou Java 21/Spring Boot. Nenhuma rota abaixo está ativa.
paths:
  /api/v1/simulations/calculate:
    post:
      summary: Validar e recalcular com o motor determinístico no servidor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, parameters, engineVersion]
              properties:
                kind:
                  enum:
                    [
                      imobiliario,
                      amortizacao,
                      consorcio,
                      veiculo,
                      quitacao,
                      investimentos,
                    ]
                engineVersion:
                  type: string
                  const: "1.0.0"
                parameters:
                  type: object
                  description: Valores decimais em strings canônicas, datas ISO; definir schemas por kind antes da implementação.
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: Resultado recalculado, premissas e versão auditável do motor
          content:
            application/json:
              schema:
                type: object
                required: [engineVersion, result, assumptions]
                properties:
                  engineVersion: { type: string }
                  result: { type: object }
                  assumptions: { type: array, items: { type: string } }
        "422": { description: Erros de validação associados aos campos }
        "429": { description: Limite de uso excedido }
  /api/v1/reports/{id}/download:
    get:
      summary: Entregar relatório somente ao proprietário com autorização comercial válida
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          {
            description: PDF gerado no servidor ou URL assinada de curta duração,
          }
        "401": { description: Não autenticado }
        "403": { description: Sem entitlement válido }
        "404":
          { description: Relatório inexistente ou não pertencente ao usuário }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
